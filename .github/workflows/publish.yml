name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A release must not be able to reach PyPI without the suite and the migration
  # check passing first. 0.1.3 shipped a model/migration drift (#5) that no gate
  # would have let through.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Django system checks
        run: python manage.py check
        working-directory: example_project
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: example_project
        env:
          PYTHONPATH: ${{ github.workspace }}

      # `python -m pytest`, not bare `pytest`: only the module form puts the
      # working directory on sys.path, and the suite imports example_project,
      # which is not part of the installed distribution.
      - name: Tests
        run: python -m pytest -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-langgraph-agent
    permissions:
      id-token: write # Required for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

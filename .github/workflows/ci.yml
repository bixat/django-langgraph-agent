name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Django system checks
        run: python manage.py check
        working-directory: example_project
        env:
          PYTHONPATH: ${{ github.workspace }}

      # Guards issue #5: a help_text edit on a documented field silently drifts
      # the model from its migration, and downstream projects cannot fix it —
      # the generated migration lands in site-packages and is lost on reinstall.
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: example_project
        env:
          PYTHONPATH: ${{ github.workspace }}

      # `python -m pytest`, not bare `pytest`: only the module form puts the
      # working directory on sys.path, and the suite imports example_project,
      # which is not part of the installed distribution.
      - name: Tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

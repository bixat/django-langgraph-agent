[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-langgraph-agent"
version = "0.2.0"
description = "A reusable Django package for building streaming AI agents with LangGraph and OpenRouter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mohammed chahboun" }]
keywords = ["django", "ai", "agent", "langgraph", "llm", "openrouter", "streaming", "sse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "django>=4.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    # SqliteSaver ships as its own distribution, and it is the default
    # checkpointer for Django's default database — without it a fresh install
    # raises ModuleNotFoundError on the first chat.
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.1"]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-mock>=3.12",
    # The tests run against example_project, whose settings list "unfold" in
    # INSTALLED_APPS. The package itself only soft-depends on django-unfold
    # (admin.py falls back to django.contrib.admin), but the suite cannot start
    # without it.
    "django-unfold>=0.40",
]
dev = [
    "django-langgraph-agent[test,postgres]",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/bixat/django-langgraph-agent"
Documentation = "https://github.com/bixat/django-langgraph-agent#readme"
Repository = "https://github.com/bixat/django-langgraph-agent"
Issues = "https://github.com/bixat/django-langgraph-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_langgraph_agent*"]

[tool.setuptools.package-data]
"django_langgraph_agent" = ["templates/**/*", "static/**/*"]


[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.settings"
# The suite runs against example_project, which is not part of the installed
# distribution. Without this, only `python -m pytest` works (it puts the
# working directory on sys.path) and a bare `pytest` fails to import it.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

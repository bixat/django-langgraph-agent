[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-langgraph-agent"
version = "0.1.0"
description = "A reusable Django package for building streaming AI agents with LangGraph and OpenRouter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mohammed chahboun" }]
keywords = ["django", "ai", "agent", "langgraph", "llm", "openrouter", "streaming", "sse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "django>=4.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "openai>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.1"]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-mock>=3.12",
]
dev = [
    "django-langgraph-agent[test,postgres]",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/tathbeet/django-langgraph-agent"
Documentation = "https://github.com/tathbeet/django-langgraph-agent#readme"
Repository = "https://github.com/tathbeet/django-langgraph-agent"
Issues = "https://github.com/tathbeet/django-langgraph-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_ai_agent*"]

[tool.setuptools.package-data]
"django_ai_agent" = ["templates/**/*", "static/**/*"]


[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
